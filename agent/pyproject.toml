[project]
name = "kdb-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.4",
    "pydantic-ai-slim[anthropic,google,mcp]>=2.54.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlglot>=30.21.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: needs the running stack (make kdb, mcp, agent, backend)",
    "llm: calls the LLM (uses model quota)",
]
