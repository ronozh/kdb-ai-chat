services:
  kdbx:
    build: .
    image: kdb-ai-chat/kdbx
    container_name: kdbx
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      KDB_USER: mcp_ro                                 # the only user allowed to log in
      KDB_USERS_FILE: /run/secrets/kdb_users.txt
    volumes:
      - ${QLIC:?set QLIC to your licence dir}:/opt/kx/lic:ro
      - ./init.q:/opt/app/init.q:ro
      - ./users.txt:/run/secrets/kdb_users.txt:ro
      - ./data/hdb:/db:ro                              # the HDB, read-only
    working_dir: /opt/app
    command: ["q", "init.q", "-T", "30", "-w", "2000"]   # -T: abort client queries after 30s; -w: 2GB cap (q aborts, Docker restarts)
    stdin_open: true   # q exits on stdin EOF
    restart: unless-stopped

  # One-off job that writes the HDB (make kdb-hdb). Only this container can write to ./data.
  hdb-builder:
    image: kdb-ai-chat/kdbx
    profiles: ["tools"]
    volumes:
      - ${QLIC:?set QLIC to your licence dir}:/opt/kx/lic:ro
      - ./gen_data.q:/opt/app/gen_data.q:ro
      - ./build_hdb.q:/opt/app/build_hdb.q:ro
      - ./data:/data
    command: ["q", "/opt/app/build_hdb.q", "-q"]

  # Admin console on the HDB (make kdb-admin / make kdb-expected). Read-only, no network port.
  kdb-admin:
    image: kdb-ai-chat/kdbx
    profiles: ["tools"]
    stdin_open: true
    tty: true
    volumes:
      - ${QLIC:?set QLIC to your licence dir}:/opt/kx/lic:ro
      - ./data/hdb:/hdb:ro
      - ./expected.q:/opt/app/expected.q:ro
